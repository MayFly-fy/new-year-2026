<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 龙马精神 · 交互总结报告</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --gold: #ffcc00; --red: #d40000; --win-blue: #000080; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: "Microsoft YaHei", sans-serif; }

        canvas#main-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* 0. 倒计时层 */
        #launch-pad { position: fixed; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }

        /* 翻页架构 */
        .wrapper { width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1); display: none; z-index: 10; }
        .screen { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center; }

        /* UI卡片 */
        .glass-card { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(15px); border: 1.5px solid var(--gold); border-radius: 25px; padding: 25px; width: 100%; max-width: 360px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .photo-frame { width: 150px; height: 150px; margin: 0 auto 15px; border: 3px solid var(--gold); border-radius: 50%; overflow: hidden; box-shadow: 0 0 20px var(--gold); }

        /* 1. 福袋交互区 */
        .fudai-box { position: relative; width: 240px; height: 300px; cursor: pointer; margin-top: 10px; }
        .fudai-img { width: 100%; height: 100%; object-fit: contain; z-index: 5; position: relative; }
        .rope-box { position: absolute; bottom: 30px; left: 125px; width: 4px; height: 90px; background: linear-gradient(to bottom, transparent, var(--gold)); transition: height 0.3s; z-index: 2; }
        .rope-end { width: 20px; height: 20px; background: var(--gold); border-radius: 50%; position: absolute; bottom: -10px; left: -8px; box-shadow: 0 0 15px var(--gold); }

        /* 2. 自动抓拍照片位 */
        #snap-container { position: fixed; bottom: 20px; right: 20px; width: 120px; background: #fff; padding: 5px; transform: rotate(5deg); display: none; z-index: 6000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #snap-img { width: 100%; height: 110px; object-fit: cover; background: #333; }
        #snap-container p { color: #000; font-size: 10px; margin: 5px 0 0; font-weight: bold; }

        /* 3. 弹窗祝福 */
        .py-window { position: fixed; width: 240px; border: 2px solid #000; box-shadow: 5px 5px 0 rgba(0,0,0,0.7); z-index: 5500; font-family: '微软雅黑'; }
        .py-title { background: var(--win-blue); color: white; padding: 2px 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 10px; }
        .py-body { padding: 10px; background: #dfdfdf; color: #000; text-align: center; border: 1px inset #fff; font-size: 12px; font-weight: bold; line-height: 1.4; }

        .next-btn { background: var(--gold); color: #000; border: none; padding: 12px 35px; border-radius: 30px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .mode-hint { font-size: 12px; color: var(--gold); margin-bottom: 10px; opacity: 0.8; height: 18px; }
    </style>
</head>
<body>

    <canvas id="main-canvas"></canvas>
    <video id="hidden-video" style="display:none;" autoplay playsinline></video>
    <canvas id="capture-canvas" style="display:none;"></canvas>

    <!-- 拍立得抓拍位 -->
    <div id="snap-container" class="animate__animated animate__jackInTheBox">
        <img id="snap-img" src="">
        <p>2026.01.01 留影</p>
    </div>

    <!-- 0. 倒计时 -->
    <div id="launch-pad">
        <div id="loading-txt" style="color: var(--gold); font-size: 14px;">正在载入 2026 龙马粒子...</div>
    </div>

    <div id="main-wrapper" class="wrapper">
        <!-- Page 0: 封面 -->
        <section class="screen">
            <h2 class="animate__animated animate__fadeInDown" style="color: var(--gold); letter-spacing: 5px;">2026 年度总结报告</h2>
            <div id="keyword-box" class="animate__animated animate__zoomIn" style="display:none; font-size: 40px; color: var(--gold); margin: 30px 0; border: 2px solid var(--gold); padding: 10px 20px;">龙马精神</div>
            <div id="reveal-trigger" onclick="revealKW()" style="width:120px; height:120px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:60px; color:#800000; cursor:pointer; box-shadow: 0 0 40px var(--gold);">福</div>
            <button id="p1-btn" class="next-btn" style="display:none;" onclick="goPage(1)">开启报告</button>
        </section>

        <!-- Page 1: 回忆 -->
        <section class="screen">
            <div class="glass-card">
                <div class="photo-frame"><img id="user-photo" src="" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=horse'"></div>
                <h3 style="color: var(--gold);">年度回忆 · 2025</h3>
                <p id="p2-text" style="line-height: 1.8; text-align: justify; margin-top: 15px; font-size: 14px;"></p>
                <button class="next-btn" onclick="goPage(2)">纵马前行</button>
            </div>
        </section>

        <!-- Page 2: 未来 -->
        <section class="screen">
            <div class="glass-card">
                <div style="font-size: 50px;">🐎</div>
                <h3 style="color: var(--gold);">2026 未来愿景</h3>
                <p id="p3-text" style="line-height: 2; margin-top: 20px; font-size: 16px;"></p>
                <button class="next-btn" onclick="requestPermissions()">双模控福</button>
            </div>
        </section>

        <!-- Page 3: 终极感应福袋 -->
        <section class="screen">
            <div class="mode-hint" id="status-display">正在激活双模感应...</div>
            <div class="fudai-box" onclick="triggerBurst()">
                <img src="fudai.png" class="fudai-img" alt="福袋">
                <div id="rope" class="rope-box"><div class="rope-end"></div></div>
            </div>
            <p style="color: var(--gold); margin-top: 20px; opacity: 0.6; font-size: 12px;">握拳 或 说出“开” 触发奇迹</p>
        </section>
    </div>

    <!-- 道歉层 -->
    <div id="apology-stage" style="display:none; position:fixed; width:100%; height:100%; background:#000; z-index:9999; align-items:center; justify-content:center; padding:25px; text-align:center;">
        <div class="glass-card animate__animated animate__zoomIn">
            <h2 style="color: var(--gold);">⚠️ 数据修正</h2>
            <p>由于手误，之前错写了名字。<b>刘家易</b>才是正确答案！现已由赤兔快马修正。</p>
            <button class="next-btn" onclick="closeApo()">进入报告</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const friendData = {
            "任美伊": { keyword: "熠熠生辉", p2: "这一年，你像初升朝阳，即便有过颠簸也选择发光。那份不被积雪压垮的坚韧，是你最迷人的魔法。", p3: "2026愿你闯过高考关卡，站在大学新起点。愿你笑容常在，眼里永远盛着期待！" },
            "刘家易": { keyword: "完胜战神", p2: "正在穿越复读副本的你，像《银魂》主角一样热血。即使日子重复，你的异想天开也从未熄灭。", p3: "2026愿你的努力像漫画分镜般兑现，目标被打上金色的“完胜”！" },
            "荆博暄": { keyword: "煦色韶光", p2: "生活不止PPT，还有你给别人的拥抱。你身上温暖的力量，让周围的人都跟着轻松。", p3: "2026愿这份力量回馈到你身上。少点熬夜，多绽放自己。" },
            "default": { keyword: "龙马精神", p2: "散落在不同经纬度的我们，都在为了理想攀登。感谢这一程山水，我们依然是彼此的星河。", p3: "2026愿我们在各自轨道发光，前程有奔赴，生活有回甘。" }
        };

        const tips = ["🎉 万事如意！", "💖 心想事成！", "🌟 前程似锦！", "🎊 幸福安康！", "🌈 好运连连！", "✨ 笑口常开！", "🎁 财源广进！", "🌺 事业有成！", "🎵 快乐每一天！", "🌸 福星高照！", "🎯 心愿成真！", "🌻 平安喜乐！", "🎈 步步高升！", "💫 吉祥如意！", "🌙 梦想成真！", "🌟记得吃早饭", "🌺别不开心", "🍀都会好起来的", "🌸没事的，没事的", "💫你是最棒的", "🌷注意保暖", "🌻做自己就好", "💖爱人先爱己", "✨你最好看了", "🍙吃饭了没", "🌼照顾好自己", "💧多喝水", "😊记得多笑笑", "🎈想要的都得到", "🍎身体健康", "🐉锦鲤附体", "🤗抱抱你"];
        const pyColors = ['#FFC0CB', '#87CEEB', '#90EE90', '#E6E6FA', '#FFFACD', '#DDA0DD', '#FF7F50', '#FFE4C4'];

        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('to');
        const data = friendData[name] || friendData["default"];

        // 1. Canvas 粒子倒计时引擎
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, textParticles = [], fireworks = [], stage = 'countdown', currentPage = 0;

        function initCanvas() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.onresize = initCanvas; initCanvas();

        class Particle {
            constructor(tx, ty, color) {
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.tx = tx; this.ty = ty; this.color = color;
                this.vx = (Math.random()-0.5)*12; this.vy = (Math.random()-0.5)*12;
                this.acc = 0.15; this.fric = 0.88;
            }
            update() {
                this.vx += (this.tx - this.x) * this.acc; this.vy += (this.ty - this.y) * this.acc;
                this.vx *= this.fric; this.vy *= this.fric;
                this.x += this.vx; this.y += this.vy;
            }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); }
        }

        function createTextParticles(text) {
            const off = document.createElement('canvas'); const octx = off.getContext('2d');
            off.width = w; off.height = h;
            octx.fillStyle = "#fff"; octx.font = `bold ${Math.min(w/2.2, 320)}px Arial`;
            octx.textAlign = "center"; octx.textBaseline = "middle";
            octx.fillText(text, w/2, h/2);
            const imgData = octx.getImageData(0,0,w,h).data;
            textParticles = [];
            for(let y=0; y<h; y+=8) {
                for(let x=0; x<w; x+=8) {
                    if(imgData[(y*w+x)*4+3] > 128) {
                        textParticles.push(new Particle(x,y, `hsl(${Math.random()*360}, 100%, 75%)`));
                    }
                }
            }
        }

        function createFW() {
            fireworks.push({x: Math.random()*w, y: h, ty: Math.random()*h*0.5, color: `hsl(${Math.random()*360},100%,60%)`, active: true, p: []});
        }
        function updateFW() {
            fireworks.forEach((f, i) => {
                if(f.active) { f.y -= 14; if(f.y <= f.ty) { f.active = false; for(let j=0; j<40; j++) f.p.push({x: f.x, y: f.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, a: 1}); } }
                else { f.p.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.a -= 0.02; }); f.p = f.p.filter(p => p.a > 0); if(f.p.length === 0) fireworks.splice(i, 1); }
            });
        }

        window.onload = () => {
            const countSeq = [3, 2, 1, "2026"];
            let idx = 0;
            const itv = setInterval(() => {
                if(idx < countSeq.length) {
                    document.getElementById('loading-txt').style.display = 'none';
                    createTextParticles(countSeq[idx].toString());
                    idx++;
                } else {
                    clearInterval(itv);
                    stage = 'main';
                    document.getElementById('launch-pad').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('launch-pad').style.display = 'none';
                        document.getElementById('main-wrapper').style.display = 'block';
                        if(name === "刘家易") document.getElementById('apology-stage').style.display = 'flex';
                    }, 1000);
                }
            }, 1800);
            loop();
        };

        function loop() {
            ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(0,0,w,h);
            if(Math.random() < 0.06) createFW(); updateFW();
            fireworks.forEach(f => {
                if(f.active) { ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI*2); ctx.fill(); }
                else { f.p.forEach(p => { ctx.fillStyle = f.color.replace('hsl', 'hsla').replace(')', `,${p.a})`); ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill(); }); }
            });
            if(stage === 'countdown') textParticles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }

        // 2. 交互与拍照逻辑
        document.getElementById('user-photo').src = `${name}.jpg`;
        document.getElementById('p2-text').innerText = data.p2;
        document.getElementById('p3-text').innerText = data.p3;

        function revealKW() {
            document.getElementById('reveal-trigger').style.display = 'none';
            document.getElementById('keyword-box').style.display = 'inline-block';
            document.getElementById('p1-btn').style.display = 'inline-block';
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        function goPage(n) { currentPage = n; document.getElementById('main-wrapper').style.transform = `translateY(-${n*100}%)`; }
        function closeApo() { document.getElementById('apology-stage').style.display = 'none'; }

        // 3. 权限请求 (语音 + 摄像头)
        let isExploded = false;
        async function requestPermissions() {
            goPage(3);
            const status = document.getElementById('status-display');
            
            // 摄像头权限
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('hidden-video').srcObject = stream;
                initHands();
                status.innerText = "手势感应已激活...";
            } catch (err) { status.innerText = "摄像头不可用，语音模式准备中..."; }

            // 语音权限
            initVoice();
        }

        function initHands() {
            const video = document.getElementById('hidden-video');
            const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6 });
            let wasOpen = false;
            hands.onResults((res) => {
                if(isExploded || currentPage !== 3) return;
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    const lm = res.multiHandLandmarks[0];
                    const avgDist = [8,12,16,20].reduce((s,i)=>s+Math.sqrt(Math.pow(lm[i].x-lm[9].x,2)+Math.pow(lm[i].y-lm[9].y,2)),0)/4;
                    if(avgDist > 0.12) wasOpen = true;
                    if(wasOpen && avgDist < 0.07) triggerBurst();
                }
            });
            const camera = new Camera(video, { onFrame: async () => { await hands.send({image: video}); } });
            camera.start();
        }

        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const reco = new SpeechRecognition();
                reco.lang = 'zh-CN';
                reco.onresult = (e) => { if(e.results[0][0].transcript.includes("开")) triggerBurst(); };
                reco.onend = () => { if(!isExploded) reco.start(); };
                reco.start();
                document.getElementById('status-display').innerText += " 语音识别已同步！";
            }
        }

        function triggerBurst() {
            if(isExploded) return;
            isExploded = true;
            
            // 瞬间抓拍
            const video = document.getElementById('hidden-video');
            const capCanvas = document.getElementById('capture-canvas');
            capCanvas.width = video.videoWidth; capCanvas.height = video.videoHeight;
            capCanvas.getContext('2d').drawImage(video, 0, 0);
            document.getElementById('snap-img').src = capCanvas.toDataURL('image/png');
            document.getElementById('snap-container').style.display = 'block';

            document.getElementById('rope').style.height = '160px';
            setTimeout(() => {
                confetti({ particleCount: 400, spread: 110, origin: { y: 0.7 }, colors: ['#ffcc00', '#ff0000', '#fff'] });
                spawnWindows();
                document.getElementById('status-display').innerText = "💥 开启成功！照片已留存";
            }, 300);
        }

        function spawnWindows() {
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const win = document.createElement('div');
                    win.className = 'py-window animate__animated animate__zoomIn';
                    win.style.left = Math.random() * (window.innerWidth - 240) + 'px';
                    win.style.top = Math.random() * (window.innerHeight - 100) + 'px';
                    win.style.background = pyColors[Math.floor(Math.random()*pyColors.length)];
                    win.innerHTML = `<div class="py-title"><span>温馨祝福</span><span>×</span></div><div class="py-body">${tips[Math.floor(Math.random()*tips.length)]}</div>`;
                    document.body.appendChild(win);
                    setTimeout(() => win.remove(), 8000);
                }, i * 130);
            }
        }
    </script>
</body>
</html>
