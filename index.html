<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 龙马精神 · 年度总结</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --red-main: #d40000;
            --red-deep: #8a0000;
            --gold-main: #ffcc00;
            --gold-light: #fff7d1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--red-deep); color: var(--gold-light); font-family: "Microsoft YaHei", sans-serif; }

        /* 全局红金背景 */
        .universe {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--red-main) 0%, var(--red-deep) 100%);
            z-index: -2;
        }
        .bg-silk {
            position: fixed; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png');
            opacity: 0.2; z-index: -1;
        }

        /* 0. 烟花字倒计时层 */
        #launch-pad {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #a40000; z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        #firework-canvas { position: absolute; top: 0; left: 0; }

        /* 1. 全屏翻页系统 */
        .wrapper { width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); display: none; }
        .screen { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }

        /* 2. 揭晓页样式 */
        .reveal-btn {
            width: 140px; height: 140px; background: linear-gradient(135deg, var(--gold-main), #fff);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 60px; color: var(--red-deep); font-weight: bold; cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.5); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* 3. 卡片样式 (B站总结感) */
        .glass-card {
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--gold-main);
            border-radius: 24px; padding: 30px 20px; width: 100%; max-width: 360px;
            text-align: center; backdrop-filter: blur(10px); box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .photo-frame {
            width: 180px; height: 180px; margin: 0 auto 20px;
            border: 3px solid var(--gold-main); border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 20px var(--gold-main);
        }

        /* 4. 福袋与拉绳 (使用你提供的图片) */
        .fudai-box { position: relative; width: 300px; height: 400px; cursor: pointer; }
        .fudai-img { width: 100%; height: 100%; object-fit: contain; z-index: 5; position: relative; }
        .pull-rope {
            position: absolute; bottom: 40px; left: 148px; width: 4px; height: 100px;
            background: linear-gradient(to bottom, transparent, var(--gold-main));
            z-index: 2; transition: height 0.2s;
        }
        .rope-end { width: 24px; height: 24px; background: var(--gold-main); border-radius: 50%; position: absolute; bottom: -12px; left: -10px; box-shadow: 0 0 10px var(--gold-main); }

        /* 5. Python Tkinter 风格弹窗 */
        .py-window {
            position: fixed; width: 280px; min-height: 100px;
            border: 2px solid #000; box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
            z-index: 1000; animation: pyPopup 0.3s ease-out forwards;
            font-family: '微软雅黑', sans-serif;
        }
        .py-title { background: #000080; color: white; padding: 2px 8px; font-size: 12px; display: flex; justify-content: space-between; font-weight: bold; }
        .py-body { padding: 15px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; color: #000; font-weight: 500; }
        @keyframes pyPopup { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 导航按钮 */
        .next-btn {
            background: var(--gold-main); color: var(--red-deep);
            border: none; padding: 12px 35px; border-radius: 30px;
            font-weight: bold; font-size: 16px; margin-top: 25px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="universe"></div>
    <div class="bg-silk"></div>

    <!-- 0. 烟花字倒计时 -->
    <div id="launch-pad">
        <canvas id="firework-canvas"></canvas>
    </div>

    <div id="main-wrapper" class="wrapper">
        <!-- Page 1: 揭晓封面 -->
        <section class="screen">
            <div class="animate__animated animate__fadeInDown" style="font-size: 14px; letter-spacing: 4px; color: var(--gold-main);">2026 年度限定报告</div>
            <h1 id="user-title" class="animate__animated animate__fadeIn" style="font-size: 38px; margin: 20px 0 40px; text-shadow: 0 0 10px var(--gold-main);">你好，朋友</h1>
            
            <div id="keyword-tag" class="animate__animated animate__zoomIn" style="font-size: 45px; color: var(--gold-main); display:none; border: 2px solid var(--gold-main); padding: 10px 20px; border-radius: 10px; margin-bottom: 40px;">龙马精神</div>

            <div id="reveal-area">
                <div class="reveal-btn" onclick="revealKeyword()">福</div>
                <p style="margin-top: 20px; letter-spacing: 2px; color: var(--gold-main);">揭晓你的年度关键词</p>
            </div>
            
            <button id="p1-next" class="next-btn" style="display:none;" onclick="goPage(1)">开启连接</button>
        </section>

        <!-- Page 2: 年度回忆 -->
        <section class="screen">
            <div class="glass-card">
                <div style="font-size: 12px; letter-spacing: 3px; color: var(--gold-main); margin-bottom: 20px;">MEMORIES · 2025</div>
                <div class="photo-frame">
                    <img id="user-photo" src="" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=horse'">
                </div>
                <h2 id="p2-title" style="color: var(--gold-main); margin-bottom: 15px;"></h2>
                <p id="p2-text" style="font-size: 16px; line-height: 1.8; text-align: justify;"></p>
                <button class="next-btn" onclick="goPage(2)">纵马前行</button>
            </div>
        </section>

        <!-- Page 3: 未来展望 -->
        <section class="screen">
            <div class="glass-card">
                <div style="font-size: 40px; margin-bottom: 20px;">🐎</div>
                <h2 style="color: var(--gold-main); margin-bottom: 20px;">2026 未来愿景</h2>
                <p id="p3-text" style="font-size: 18px; line-height: 2;"></p>
                <button class="next-btn" onclick="goPage(3)">抽取福袋</button>
            </div>
        </section>

        <!-- Page 4: 终极福袋 -->
        <section class="screen">
            <h2 class="animate__animated animate__fadeInDown" style="color: var(--gold-main); margin-bottom: 30px;">拉动绳子，开启万福</h2>
            <div class="fudai-box" ontouchstart="ropeActive(true)" ontouchend="ropeActive(false)" onclick="explodeFudai()">
                <img src="fudai.png" class="fudai-img" alt="福袋">
                <div id="rope" class="pull-rope">
                    <div class="rope-end"></div>
                </div>
            </div>
            <p style="color: var(--gold-main); opacity: 0.6; margin-top: 20px;">—— 点击福袋或拉动绳子 ——</p>
        </section>
    </div>

    <!-- 刘家易道歉层 -->
    <div id="apology-stage" style="display:none; position:fixed; width:100%; height:100%; background:var(--red-deep); z-index:5000; align-items:center; justify-content:center;">
        <div class="glass-card animate__animated animate__zoomIn">
            <h2 style="color: var(--gold-main);">🙇‍♀️ 特别更正声明</h2>
            <p>由于我的手误，刚才在名字录入中出现了偏差。<b>刘家易</b>才是最正确的打开方式！请接受这份来自马年的歉意。</p>
            <button class="next-btn" onclick="closeApology()">接受道歉并进入</button>
        </div>
    </div>

    <script>
        // 祝福语库 (来自你的 Python 代码)
        const tips = [
            '愿你三冬暖，春不寒，天黑有灯，下雨有伞，路上有良人相伴，一生被温柔以待。',
            '愿你遍历山河，觉得人间值得，无论经历多少风雨，都能保持内心的澄澈与热爱。',
            '愿你所求皆如愿，所行皆坦途，日子如熹光，温柔又明亮，每天都有小确幸相伴。',
            '愿你被这个世界温柔以待，躲不过的惊吓都只是虚惊一场，收到的欢喜都恰如所期。',
            '愿你往后余生，快乐是本能，幸福是常态，不为往事忧，只为余生笑，活得自在洒脱。',
            '愿你有高跟鞋也有跑鞋，喝茶也喝酒，有勇敢的朋友，也有强大的对手，活出自己的精彩。',
            '愿你眼中总有光芒，活成自己喜欢的模样，走过千山万水，归来仍是少年，初心不改。',
            '愿你在迷茫时，坚信自己的珍贵，爱你所爱，行你所行，听从你心，无问西东，终会抵达。',
            '愿你一生努力，一生被爱，想要的都拥有，得不到的都释怀，平安喜乐，顺遂无忧。',
            '愿你如向日葵般，永远向阳而生，无论遇到什么困境，都能找到温暖的光芒与前行的力量。'
        ];
        const pyColors = ['#FFC0CB', '#87CEEB', '#90EE90', '#E6E6FA', '#FFFACD', '#DDA0DD', '#FF7F50', '#FFE4C4'];

        const friendData = {
            "任美伊": { keyword: "熠熠生辉", p2: "过去这一年，你像初升的朝阳一样闪闪发光。即使有过颠簸，你依然选择做最明亮的自己。这种不被雪花压垮的坚韧，真的很有感染力！", p3: "2026愿你勇敢闯过高考关卡，站在大学的新起点。愿你脚步轻快，笑容常在，眼里永远盛着对明天的期待。万事皆甜，勇往直前！" },
            "刘家易": { keyword: "完胜战神", p2: "现在的你正和题库进行着“长期作战”，就像《银魂》里的精神一样，即使日子重复，你的异想天开也从未熄灭。这正是你最耀眼的地方。", p3: "2026愿你的努力像JUMP分镜一样逐帧兑现，愿你的目标被打上金色的“完胜”！等你荣耀归来，大学生活正等着你这个超酷的副本。" },
            "荆博暄": { keyword: "煦色韶光", p2: "生活不止PPT，还有你递给别人的拥抱。这一年，你身上那种温暖的力量，让周围的人都跟着轻松起来。你值得被温柔以待。", p3: "2026愿这份力量更多回馈到你身上。少操心别人，多让自己尽情绽放。好运一定会准时到达！" },
            "武蓉萱": { keyword: "灵感极客", p2: "那些与小车反复调试的深夜，塑造了你理性可靠的模样。在复杂的逻辑里，你总能找到通向成功的代码。新的一年，愿你的世界既有逻辑的优美，也有诗意的轻盈。", p3: "2026愿电路接通灵感，代码书写从容。不必总是跑得太急，偶尔也去二游的世界享受一场冒险。" },
            "default": { keyword: "龙马精神", p2: "这一年，我们散落在不同的经纬度，各自为了理想攀登。感谢在这一程山水里，我们依然是彼此的支柱与银河。", p3: "2026愿我们在各自的轨道上发光，前程有奔赴，生活有回甘。愿笔尖与键盘，都能敲开通往理想生活的密钥。" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('to');
        const data = friendData[name] || friendData["default"];

        // 1. 烟花字倒计时实现 (Canvas)
        const canvas = document.getElementById('firework-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function drawFireworkText(text) {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#ffcc00";
            ctx.font = "bold 150px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            // 简单处理：将文字变为粒子效果 (这里做演示，实际使用更复杂的粒子库效果更好)
            const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let y=0; y<canvas.height; y+=6) {
                for(let x=0; x<canvas.width; x+=6) {
                    if(imgData.data[(y*canvas.width + x)*4 + 3] > 128) {
                        ctx.fillStyle = `hsl(${Math.random()*360}, 100%, 70%)`;
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }
        }

        let count = 3;
        const countTimer = setInterval(() => {
            if(count > 0) {
                drawFireworkText(count);
                count--;
            } else if (count === 0) {
                drawFireworkText("2026");
                count--;
            } else {
                clearInterval(countTimer);
                document.getElementById('launch-pad').classList.add('animate__animated', 'animate__fadeOut');
                setTimeout(() => {
                    document.getElementById('launch-pad').style.display = 'none';
                    document.getElementById('main-wrapper').style.display = 'block';
                    if(name === "刘家易") document.getElementById('apology-stage').style.display = 'flex';
                }, 1000);
            }
        }, 1500);

        // 初始化内容
        document.getElementById('user-title').innerText = name ? `你好，${name}` : "你好，朋友";
        document.getElementById('keyword-tag').innerText = data.keyword;
        document.getElementById('p2-text').innerText = data.p2;
        document.getElementById('p3-text').innerText = data.p3;
        if(name) document.getElementById('user-photo').src = `${name}.jpg`;

        // 交互逻辑
        function revealKeyword() {
            document.getElementById('reveal-area').style.display = 'none';
            document.getElementById('keyword-tag').style.display = 'inline-block';
            document.getElementById('p1-next').style.display = 'inline-block';
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ffcc00', '#ff0000'] });
        }

        function goPage(idx) { document.getElementById('main-wrapper').style.transform = `translateY(-${idx * 100}%)`; }
        function closeApology() { document.getElementById('apology-stage').style.display = 'none'; }
        
        function ropeActive(active) {
            document.getElementById('rope').style.height = active ? '160px' : '100px';
        }

        // 核心：模拟 Python 弹窗流
        function explodeFudai() {
            ropeActive(true);
            setTimeout(() => {
                confetti({ particleCount: 300, spread: 100, origin: { y: 0.8 }, colors: ['#ffcc00', '#ff0000', '#fff'] });
                
                // 模拟 Python 创建 100 个祝福窗口
                for(let i=0; i<80; i++) {
                    setTimeout(() => {
                        const win = document.createElement('div');
                        win.className = 'py-window';
                        const tip = tips[Math.floor(Math.random()*tips.length)];
                        const bg = pyColors[Math.floor(Math.random()*pyColors.length)];
                        
                        win.style.left = Math.random() * (window.innerWidth - 280) + 'px';
                        win.style.top = Math.random() * (window.innerHeight - 150) + 'px';
                        win.style.background = bg;

                        win.innerHTML = `
                            <div class="py-title"><span>温馨祝福</span><span>×</span></div>
                            <div class="py-body">${tip}</div>
                        `;
                        document.body.appendChild(win);
                        
                        // 6秒后自动消失
                        setTimeout(() => win.remove(), 6000);
                    }, i * 100);
                }
            }, 300);
        }
    </script>
</body>
</html>
