<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 年度限定祝福</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --gold: #ffcc00;
            --red: #a40000;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff7d1; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }

        /* 背景：红金流光 */
        .bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at center, #d40000 0%, #600000 100%); z-index: -1; }
        .bg-pattern { position: fixed; width: 100%; height: 100%; background-image: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png'); opacity: 0.1; z-index: -1; }

        /* 页面容器 */
        .container { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
        .page { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px; flex-shrink: 0; }

        /* 磨砂玻璃卡片 */
        .card { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(15px); border: 1px solid rgba(255, 204, 0, 0.2); border-radius: 24px; padding: 30px 20px; width: 100%; max-width: 350px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        /* 装饰元素 */
        .keyword-badge { display: inline-block; padding: 4px 12px; border: 1px solid var(--gold); border-radius: 4px; font-size: 12px; color: var(--gold); margin-bottom: 15px; letter-spacing: 2px; }
        .page-num { position: absolute; bottom: 30px; font-family: serif; font-style: italic; opacity: 0.4; font-size: 14px; }

        /* 标题与文字 */
        h1 { font-size: 26px; color: var(--gold); margin: 10px 0 20px; text-align: center; letter-spacing: 2px; }
        p { font-size: 17px; line-height: 1.8; text-align: justify; margin: 0; opacity: 0.95; }

        /* 按钮 */
        .btn-next { background: var(--gold); color: #800000; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; margin-top: 30px; font-size: 15px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,204,0,0.3); }

        /* 道歉弹窗 */
        #apology-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        
        /* 进场动画补丁 */
        .active-text { animation: fadeInUp 1s forwards; }

        /* 进度条 */
        .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); transition: width 0.3s; z-index: 100; }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div class="bg-pattern"></div>
    <div class="progress-bar" id="p-bar" style="width: 0%"></div>

    <!-- 1. 封面 -->
    <div id="main-view" style="width:100%; height:100%; display: flex; flex-direction: column;">
        <div id="pages-container" class="container">
            
            <!-- Page 1: 封面 -->
            <section class="page">
                <div class="animate__animated animate__zoomIn" style="text-align:center;">
                    <div style="font-size: 14px; letter-spacing: 5px; opacity: 0.7;">2026 EXCLUSIVE</div>
                    <h2 id="user-name" style="font-size: 45px; margin: 20px 0; color: var(--gold);">你好</h2>
                    <div class="keyword-badge" id="user-keyword">正在载入关键词</div>
                    <p style="text-align:center; opacity:0.8;">这是为你准备的年度总结报告</p>
                    <button class="btn-next" onclick="scrollPage(1)">开启报告</button>
                </div>
            </section>

            <!-- Page 2: 回忆 -->
            <section class="page">
                <div class="card">
                    <div class="keyword-badge">CHAPTER 01 · 回首</div>
                    <h1 id="p2-title">过去的一年</h1>
                    <p id="p2-text"></p>
                    <button class="btn-next" onclick="scrollPage(2)">继续阅读</button>
                </div>
                <div class="page-num">01 / 03</div>
            </section>

            <!-- Page 3: 展望 -->
            <section class="page">
                <div class="card">
                    <div class="keyword-badge">CHAPTER 02 · 启程</div>
                    <h1 id="p3-title">2026 的期许</h1>
                    <p id="p3-text"></p>
                    <button class="btn-next" onclick="scrollPage(3)">查看寄语</button>
                </div>
                <div class="page-num">02 / 03</div>
            </section>

            <!-- Page 4: 结局 -->
            <section class="page">
                <div class="card">
                    <div class="keyword-badge">CHAPTER 03 · 守护</div>
                    <h1>永远在身后</h1>
                    <p id="p4-text"></p>
                    <button class="btn-next" onclick="location.reload()" style="background:transparent; border:1px solid var(--gold); color:var(--gold);">重新开启</button>
                </div>
                <div class="page-num">03 / 03</div>
                <div style="margin-top: 40px; font-size: 12px; opacity: 0.5;">点击屏幕任意位置燃放烟花</div>
            </section>
        </div>
    </div>

    <!-- 道歉弹窗 -->
    <div id="apology-overlay">
        <div class="card animate__animated animate__bounceIn" style="text-align: center;">
            <h2 style="color: var(--gold);">🙇‍♀️ 特别更正声明</h2>
            <p style="margin: 20px 0;">
                系统检测到刚才在输入名字时发生了严重偏移！<br><br>
                <span style="font-size: 22px; color: #fff;">刘家易</span><br><br>
                对不起，家易！由于我的粗心把名字打错了。请接受这份诚挚的道歉~
            </p>
            <button class="btn-next" onclick="closeApology()">接受道歉并进入报告</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const friendData = {
            "任美伊": {
                keyword: "闪闪发光",
                p2: "过去的日子或许有些颠簸与曲折，但崭新的篇章已经打开。你曾像初升的朝阳一样，即便有云层遮挡也依然试图散发光芒。那些沉重与烦心，终会像抖落肩上的雪花一样消散。",
                p3: "2026年，愿你勇敢地闯过高考难关，站在大学的全新起点。祝你每一天都自信满满，笑容常在。愿你的脚步轻快，眼里永远盛着对明天的期待！",
                p4: "记得多为自己骄傲哦。比起精致的妆容，我觉得你的性格才是让你发光的魔法！新年快乐，万事皆甜～"
            },
            "荆博暄": {
                keyword: "温暖如风",
                p2: "你总是在别人低落时递上阳光，那种温暖又明亮的力量，让周围的人都跟着轻松。生活不该只有忙碌的任务，那些压榨人的琐事，值得被一键删除清空。",
                p3: "2026年，愿这份力量更多回馈到你自己。少点熬夜赶工，多点从容微笑；少为别人的事操心，多让自己尽情绽放。你这样优秀的女孩，运气一定要配得上你的努力！",
                p4: "新年快乐，万事顺意！记得照顾好自己，你笑起来的样子，才是最美的风景。自由如风，万事胜意！"
            },
            "武蓉萱": {
                keyword: "理性建造者",
                p2: "那些与小车反复调试的深夜，那些精密计算的时刻，塑造了你理性而清晰的模样。在复杂的逻辑与电路间，你始终是那个最可靠的守护者。",
                p3: "新的一年，愿你的世界既有逻辑的优美，也有诗意的轻盈。愿电路接通灵感，代码书写从容。不必总是跑得太急，偶尔也去二游的箱庭里进行一场不必赶时间的冒险。",
                p4: "祝你，在新的一年里，调试顺利，灵感常驻。永远是你自己宇宙里最清醒、最温柔的建造者。"
            },
            "晋伊": {
                keyword: "甜蜜算法",
                p2: "过去的一年，你让代码跳舞，让日子发光。在算法与逻辑的世界里，你始终保持着那份可爱的纯真。不管是繁琐的程序还是生活的琐碎，你都处理得井井有条。",
                p3: "祝你的 2026 像完美部署的程序：该相遇的总会相遇，该运行的一路顺畅！愿你不仅仅只是姐姐与姐夫的“电灯泡”，也会在新的一年收获属于自己的那份甜蜜泡泡。",
                p4: "世界上最棒的算法就是：你的快乐+热爱+小幸运！愿你的生活永远运行在“开心模式”，每天都有新惊喜！"
            },
            "刘家易": {
                keyword: "热血灵魂",
                p2: "致正在穿越“复读副本”的你：你正像《银魂》里的主角一样，用那股“不按常理出牌”的精神进行着长期作战。即使面对重复的日常，你的异想天开也从未熄灭。",
                p3: "2026年，愿你的笔像洞爷湖木刀一样劈开难题！愿你的努力像JUMP漫画分镜一样逐帧兑现，愿你的目标在结局页被打上金金闪闪的“完胜”！",
                p4: "累了就喝杯草莓牛奶，或者对着肌肉男海报高呼青春！等你荣耀归来，未来的大学生活一定会喊：“欢迎来到更酷的副本！”"
            },
            "孙逸莹": {
                keyword: "长安晨钟",
                p2: "从保定到西安，距离改变了，但你身上那种让人安心的力量从未改变。不管是初中的杂乱事务还是现在的异乡生活，你始终稳稳地走在自己的轨道上。",
                p3: "愿你的 2026 像西安的晨钟暮鼓——踏实而从容。愿你在古老的城市里书写崭新的故事，让烦恼像巷子里蒸腾的热气，渐渐飘散。你在异乡，也始终被温暖环绕。",
                p4: "可靠如你，也完全有资格卸下担子。新年快乐，我亲爱的老朋友！愿你始终眉眼弯弯，万事皆好。"
            },
            "陈奕伽": {
                keyword: "蓄力冲刺",
                p2: "此刻的你正埋头于书山题海，用每一支笔芯标记通往梦想的距离。你曾说想去南方，想看大湾区的灯火，那颗星一直就在你卷子的间隙里闪烁。",
                p3: "愿六月的答卷兑现所有的深夜，愿九月的列车载你抵达暖风扑面的海岸线。压力袭来时，记得这十几年的友情攒下的“能量包”，随时可以为你续航。",
                p4: "加油，亲爱的老朋友！你值得所有美好，包括那片正奔赴而来的、南方的海。六月凯旋，我们好好庆祝！"
            },
            "李晨昱": {
                keyword: "蓝图重绘",
                p2: "此刻的你正用旧日的勇气体面地面对崭新的挑战。复读的时光是写给未来的密信，每一笔都带着加倍的认真。你像小太阳一样照亮别人，也请照亮你自己。",
                p3: "2026年，愿你的课桌洒满笃定的光，愿你的勤奋兑换成最明亮的答案。那些你给予他人的温暖，正以更大的能量回流向你。请继续保持那份珍贵的天真与热忱。",
                p4: "等到盛夏的风吹来好消息，我一定会为你欢呼。加油，亲爱的！你值得那个奔跑而来的、光明的未来。"
            },
            "default": {
                keyword: "共同银河",
                p2: "这一年，我们散落在不同的经纬度上——有人在书桌前攀登，有人在实验室解码，有人在赛道上启航。我们各自作战，却又在某种频率上始终共鸣。",
                p3: "2026年，愿我们在属于自己的战场里落地生花。愿笔尖流出的答案、键盘敲出的代码，都成为通往理想生活的密钥。愿我们在奋斗的间隙，永远保有让自己快乐的能力。",
                p4: "感谢你们又陪我走过一程山水。新的一年，愿我们继续在各自的轨道上发光。前程有奔赴，生活有回甘！"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('to');
        const data = friendData[name] || friendData["default"];

        // 初始化内容
        document.getElementById('user-name').innerText = name || "朋友们";
        document.getElementById('user-keyword').innerText = data.keyword;
        document.getElementById('p2-text').innerText = data.p2;
        document.getElementById('p3-text').innerText = data.p3;
        document.getElementById('p4-text').innerText = data.p4;

        // 刘家易特殊处理
        if (name === "刘家易") {
            document.getElementById('apology-overlay').style.display = 'flex';
        }

        function closeApology() {
            document.getElementById('apology-overlay').classList.add('animate__animated', 'animate__fadeOut');
            setTimeout(() => { document.getElementById('apology-overlay').style.display = 'none'; }, 500);
        }

        // 翻页逻辑
        let currentPage = 0;
        const totalPages = 4;
        function scrollPage(step) {
            currentPage = step;
            const container = document.getElementById('pages-container');
            container.style.transform = `translateY(-${currentPage * 100}%)`;
            document.getElementById('p-bar').style.width = `${(currentPage / (totalPages-1)) * 100}%`;
            
            // 最后一页放烟花
            if (currentPage === 3) {
                setInterval(autoFire, 2000);
            }
        }

        // 烟花逻辑
        function autoFire() {
            confetti({ particleCount: 30, spread: 70, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ffcc00', '#ff0000'] });
        }

        window.onclick = (e) => {
            confetti({ particleCount: 15, spread: 50, origin: { x: e.clientX/window.innerWidth, y: e.clientY/window.innerHeight }, colors: ['#ffcc00', '#ffffff'] });
        };
    </script>
</body>
</html>
